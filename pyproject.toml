[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "raod"
version = "0.1.0"
description = "RAOD: zero-shot open-vocabulary object detection using dense feature matching + retrieval"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "NewJerseyStyle"}
]
dependencies = [
  "numpy",
  "Pillow",
  "ftfy",
  "regex",
  "torch",
  "torchvision",
  "transformers",
  "chromadb",
  "segment-anything",
  "hdbscan"
]

[project.optional-dependencies]
coco = []

[project.scripts]
raod = "raod.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["raod"]
